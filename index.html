<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无人直播 · 口播控制台</title>
    <style>
        /* ============ Reset & Variables ============ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f5f5fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0f0f7;
            --bg-card: #e8e8f2;
            --bg-hover: #dddde8;
            --bg-input: #fafafe;
            --border: #dcdce8;
            --border-active: #6c5ce7;
            --text-primary: #1a1a2e;
            --text-secondary: #5a5a78;
            --text-muted: #9898b0;
            --accent: #6c5ce7;
            --accent-light: #5a4bd1;
            --accent-glow: rgba(108, 92, 231, 0.2);
            --success: #009b78;
            --danger: #e8456c;
            --warning: #e6a800;
            --highlight: #e6a800;
            --highlight-bg: rgba(230, 168, 0, 0.18);
            --danmaku-1: #4a9eff;
            --danmaku-2: #00b388;
            --danmaku-3: #e6a800;
            --danmaku-4: #e85a82;
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --shadow: 0 2px 16px rgba(0,0,0,.06);
            --transition: 0.2s cubic-bezier(.4,0,.2,1);
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ============ Layout ============ */
        .app {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* ============ Left Panel - Danmaku ============ */
        .danmaku-panel {
            width: 340px;
            min-width: 340px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .danmaku-header {
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .danmaku-header h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .danmaku-header h2 .icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent), #8b7cf7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .danmaku-badge {
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
            animation: pulse-badge 2s infinite;
        }

        @keyframes pulse-badge {
            0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
            50% { box-shadow: 0 0 0 6px transparent; }
        }

        .danmaku-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            scroll-behavior: smooth;
        }

        .danmaku-list::-webkit-scrollbar {
            width: 4px;
        }
        .danmaku-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .danmaku-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .danmaku-item {
            display: flex;
            gap: 10px;
            padding: 10px 12px;
            margin-bottom: 6px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            transition: all var(--transition);
            animation: slideIn 0.3s ease;
        }

        .danmaku-item:hover {
            background: var(--bg-hover);
            border-color: var(--border);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .danmaku-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }
        .c1 { background: var(--danmaku-1); }
        .c2 { background: var(--danmaku-2); }
        .c3 { background: var(--danmaku-3); }
        .c4 { background: var(--danmaku-4); }

        .danmaku-body {
            flex: 1;
            min-width: 0;
        }

        .danmaku-user {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .danmaku-text {
            font-size: 13px;
            color: #1f1f3a;
            font-weight: 500;
            line-height: 1.5;
            word-break: break-all;
        }

        .danmaku-time {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 400;
            white-space: nowrap;
        }

        .danmaku-replied-label {
            font-size: 10px;
            color: var(--success);
            font-weight: 600;
            white-space: nowrap;
            text-align: center;
        }

        /* Danmaku reply button */
        .danmaku-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .danmaku-reply-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .danmaku-reply-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ============ Reply Modal ============ */
        .reply-modal {
            align-items: flex-start;
            padding-top: 60px;
        }

        .reply-modal .modal {
            width: 480px;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
        }

        .reply-modal .modal-body {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .reply-danmaku-quote {
            background: var(--bg-tertiary);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--text-primary);
            border-left: 3px solid var(--accent);
            line-height: 1.5;
        }

        .reply-danmaku-quote .quote-user {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .reply-match-info {
            font-size: 12px;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: rgba(0, 155, 120, 0.06);
            border-radius: var(--radius-sm);
        }

        .reply-match-info .match-keywords {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .reply-match-info .kw-tag {
            background: rgba(0, 155, 120, 0.15);
            color: var(--success);
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .reply-no-match {
            font-size: 12px;
            color: var(--text-muted);
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reply-options-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .reply-options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .reply-option-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .reply-option-card:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
        }

        .reply-option-card.selected {
            border-color: var(--accent);
            background: rgba(108, 92, 231, 0.06);
        }

        .reply-option-text {
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .reply-option-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-muted);
        }

        .reply-option-meta .tts-tag {
            font-family: 'SF Mono', 'Fira Code', monospace;
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 4px;
            color: var(--accent-light);
        }

        .reply-option-check {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 10px;
            color: transparent;
            transition: all var(--transition);
        }

        .reply-option-card.selected .reply-option-check {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        /* Manual reply area */
        .reply-manual-section {
            border-top: 1px dashed var(--border);
            padding-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .reply-manual-section .section-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .reply-manual-section textarea {
            width: 100%;
            min-height: 72px;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            line-height: 1.5;
            resize: vertical;
            outline: none;
        }

        .reply-manual-section textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .reply-manual-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-reply-polish {
            padding: 6px 14px;
            background: transparent;
            border: 1px solid var(--warning);
            color: var(--warning);
            border-radius: var(--radius-sm);
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-reply-polish:hover {
            background: rgba(230, 168, 0, 0.12);
        }

        .btn-reply-send {
            padding: 8px 20px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }

        .btn-reply-send:hover {
            background: #7c6ff7;
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        .btn-reply-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .reply-char-count {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ============ Right Panel ============ */
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        /* ============ Content Area ============ */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 16px 20px;
        }

        /* ============ Play Queue ============ */
        .queue-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .queue-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }

        .queue-list::-webkit-scrollbar {
            width: 5px;
        }
        .queue-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .queue-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 5px;
        }

        .queue-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            margin-bottom: 8px;
            background: var(--bg-tertiary);
            border-radius: var(--radius);
            border: 1px solid transparent;
            transition: all var(--transition);
        }

        .queue-item:hover {
            background: var(--bg-hover);
            border-color: var(--border);
        }

        .queue-item.playing {
            border-color: var(--success) !important;
            background: rgba(0, 155, 120, 0.06) !important;
        }

        .queue-item.played {
            opacity: 0.55;
        }

        .queue-item.played:hover {
            opacity: 0.85;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .queue-num {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .queue-item.playing .queue-num {
            background: rgba(0, 155, 120, 0.12);
            color: var(--success);
        }

        .queue-text {
            flex: 1;
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-secondary);
            min-width: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
        }

        .queue-text.expanded {
            display: block;
            -webkit-line-clamp: unset;
            overflow: visible;
        }

        .queue-item.playing .queue-text {
            display: block;
            -webkit-line-clamp: unset;
            overflow: visible;
            cursor: default;
        }

        .queue-text .char {
            transition: all 0.15s ease;
        }

        .queue-text .char.current {
            color: var(--danger);
            background: rgba(232, 69, 108, 0.15);
            border-radius: 3px;
            font-weight: 700;
        }

        .queue-tag {
            font-size: 10px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .queue-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            font-family: inherit;
            outline: none;
        }

        .btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-danger {
            color: var(--danger);
            border-color: transparent;
        }
        .btn-danger:hover {
            background: rgba(232, 69, 108, 0.12);
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-warning {
            color: var(--warning);
            border-color: transparent;
        }
        .btn-warning:hover {
            background: rgba(230, 168, 0, 0.12);
            border-color: var(--warning);
            color: var(--warning);
        }

        .btn-edit {
            color: var(--accent-light);
            border-color: transparent;
        }
        .btn-edit:hover {
            background: rgba(108, 92, 231, 0.12);
            border-color: var(--accent);
            color: var(--accent-light);
        }

        /* ============ Edit Modal ============ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            width: 520px;
            max-width: 90vw;
            transform: translateY(10px);
            transition: transform 0.2s;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .modal textarea {
            width: 100%;
            min-height: 120px;
            padding: 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            line-height: 1.6;
            resize: vertical;
            outline: none;
        }

        .modal textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 20px;
        }
        .btn-primary:hover {
            background: #7c6ff7;
            color: #fff;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 20px;
        }

        /* ============ Toast ============ */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 10000;
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* ============ Empty State ============ */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            gap: 8px;
        }

        .empty-state .empty-icon {
            font-size: 36px;
            opacity: 0.4;
            margin-bottom: 8px;
        }

        /* ============ Queue Toolbar ============ */
        .queue-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .queue-toolbar-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .room-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .room-id-input {
            width: 150px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            background: var(--bg-subtle);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
        }

        .room-id-input:focus {
            border-color: var(--accent);
        }

        .room-id-input::placeholder {
            color: var(--text-muted);
        }

        .btn-live {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s, opacity 0.2s;
        }

        .btn-live.off {
            background: #22c55e;
            color: #fff;
        }

        .btn-live.off:hover {
            background: #16a34a;
        }

        .btn-live.on {
            background: #ef4444;
            color: #fff;
        }

        .btn-live.on:hover {
            background: #dc2626;
        }

        .btn-pause {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            background: #f59e0b;
            color: #fff;
            transition: background 0.2s;
        }

        .btn-pause:hover {
            background: #d97706;
        }

        .btn-pause.resumed {
            background: #22c55e;
        }

        .btn-pause.resumed:hover {
            background: #16a34a;
        }

        .btn-kb {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 6px 14px;
            font-weight: 600;
        }
        .btn-kb:hover {
            background: #7c6ff7;
            color: #fff;
        }

        /* ============ Knowledge Base Modal ============ */
        .kb-modal-overlay .modal.kb-modal {
            width: 900px;
            max-width: 96vw;
            max-height: 84vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
        }

        .kb-modal-overlay .modal.kb-modal h3 {
            margin-bottom: 14px;
            flex-shrink: 0;
            padding: 20px 20px 0;
        }

        .kb-tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--border);
            flex-shrink: 0;
            margin-bottom: 16px;
        }

        .kb-tab {
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;

<body>
    <div class="app">
        <!-- ============ LEFT: 弹幕面板 ============ -->
        <aside class="danmaku-panel">

                <h2>
                    <span class="icon">💬</span>
                    直播弹幕
                </h2>
                <span class="danmaku-badge" id="danmakuCount">0</span>
            </div>
            <div class="danmaku-list" id="danmakuList">
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div>暂无弹幕</div>
                    <div style="font-size:11px;margin-top:4px;">等待观众提问…</div>
                </div>
            </div>
        </aside>

        <!-- ============ RIGHT: 主面板 ============ -->
        <main class="main-panel">
            <!-- Content -->
            <div class="content-area">
                <!-- Play Queue -->
                <section class="queue-section">
                    <div class="queue-toolbar">
                        <span class="queue-toolbar-title">📋 播放列表</span>
                        <div class="room-controls">
                            <input type="text" class="room-id-input" placeholder="输入Room ID" id="roomIdInput" value="">
                            <button class="btn btn-live off" id="btnLiveToggle" onclick="app.toggleLive()">🔴 开启直播</button>
                            <button class="btn btn-pause" id="btnPauseToggle" onclick="app.pauseBroadcast()" style="display: none;">⏸ 暂停口播</button>
                        </div>
                        <button class="btn btn-kb" onclick="app.openBcastTextModal()">📝 口播文案</button>
                        <button class="btn btn-kb" onclick="app.openAnswerTextModal()">💬 问答文案</button>
                        <button class="btn btn-kb" onclick="app.openKB()">📚 历史音频</button>
                    </div>
                    <div class="queue-list" id="queueList">
                        <div class="empty-state">
                            <div class="empty-icon">📝</div>
                            <div>队列为空</div>
                        </div>
                    </div>
                </section>


            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3>✏️ 修改文案</h3>
            <textarea id="editTextarea" placeholder="修改文案内容…"></textarea>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="btnCancel">取消</button>
                <button class="btn btn-primary" id="btnSave">保存修改</button>
            </div>
        </div>
    </div>

    <!-- Reply Modal -->
    <div class="modal-overlay reply-modal" id="replyModal">
        <div class="modal">
            <h3 id="replyModalTitle">💬 回复弹幕</h3>
            <div class="modal-body" id="replyModalBody">
                <!-- dynamically filled -->
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="btnReplyCancel">取消</button>
                <button class="btn-reply-send" id="btnReplySend" disabled>确认并加入队列</button>
            </div>
        </div>
    </div>

    <!-- 口播文案 Modal -->
    <div class="modal-overlay" id="bcastTextModal">
        <div class="modal" style="max-width: 700px;">
            <h3>📝 口播文案知识库</h3>

            <textarea id="bcastTextArea" class="text-modal-ta" placeholder="请输入口播文案，每行一条...&#10;例如：&#10;这款产品采用进口材质，手感非常好&#10;今天直播间专属价格，比平时便宜50元"></textarea>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="app.saveBcastText()">💾 保存</button>
                <button class="btn btn-cancel" onclick="app.downloadBcastText()">⬇️ 下载 broadcast.txt</button>
                <button class="btn btn-cancel" onclick="document.getElementById('bcastTextModal').classList.remove('active')">关闭</button>
            </div>
        </div>
    </div>

    <!-- 问答文案 Modal -->
    <div class="modal-overlay" id="answerTextModal">
        <div class="modal" style="max-width: 700px;">
            <h3>💬 问答文案知识库</h3>

            <div class="modal-actions">
                <button class="btn btn-primary" onclick="app.saveAnswerText()">💾 保存</button>
                <button class="btn btn-cancel" onclick="app.downloadAnswerText()">⬇️ 下载 answer.txt</button>

            </div>
        </div>

                            <span class="kb-stat-val" id="replySpeed">0s</span>

                        <div class="kb-stat-row">

                            <span class="kb-stat-val" id="aiGenerated">0</span>
                        </div>
                        <div class="kb-stat-row">
                            <span class="kb-stat-label">知识库</span>
                            <span class="kb-stat-val" id="kbCount">0</span>

                    <div class="kb-content" id="kbContent">

                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-cancel" id="btnKBClose">关闭</button>
                    </div>
                </div>
            </div>
        </div>

    <script>
        (function() {
            // ==================== STATE ====================
            const state = {
                playlist: [],
                playingIdx: -1,
                currentPlaying: null,
                danmaku: [],
                editingIndex: null,
                editingType: 'playlist',
                charTimer: null,
                currentCharIndex: 0,
                replyTargetIndex: null,
                replySelectedOption: -1,

            // ==================== KEYWORD MATCHING ====================
            function matchKeywords(text) {
                const matched = [];
                const seen = new Set();
                const lowerText = text.toLowerCase();
                
                // 同义词映射
                const synonyms = {
                    '发货': ['发出', '发出货', '发出去', '发货了', '发货吗', '发货吧', '发货时间', '发货日期'],
                    '快递': ['物流', '运送', '运输', '寄送', '寄出', '邮寄'],
                    '退货': ['退款', '退换', '退掉', '退回去', '退回', '退还'],
                    '售后': ['售后服务', '客服', '客服服务', '客户服务', '服务'],
                    '价格': ['价钱', '价位', '价目', '售价', '卖价', '定价'],
                    '优惠': ['折扣', '打折', '降价', '特价', '活动', '促销'],
                    '质量': ['品质', '质地', '好坏', '优劣', '品质如何'],
                    '库存': ['存货', '现货', '有货', '没货', '缺货', '断货'],
                    '尺寸': ['大小', '规格', '尺码', '号型', '号码'],
                    '颜色': ['色彩', '色调', '色号', '色系', '花色'],
                };
                
                // 模糊匹配函数
                function fuzzyMatch(keyword, text) {
                    const kw = keyword.toLowerCase();
                    const txt = lowerText;
                    
                    // 1. 精确匹配
                    if (txt.includes(kw)) return 1.0;
                    
                    // 2. 同义词匹配
                    if (synonyms[kw]) {
                        for (const synonym of synonyms[kw]) {
                            if (txt.includes(synonym)) return 0.9;
                        }
                    }
                    
                    // 3. 部分匹配（包含关系）
                    for (let i = 0; i < kw.length; i++) {
                        for (let j = i + 2; j <= kw.length; j++) {
                            const sub = kw.substring(i, j);
                            if (sub.length >= 2 && txt.includes(sub)) {
                                return 0.7 * (sub.length / kw.length);
                            }
                        }
                    }
                    
                    // 4. 拼音匹配（简单实现）
                    const pinyinMap = {
                        'fa': '发',
                        'huo': '货',
                        'tui': '退',
                        'kuai': '快',
                        'di': '递',
                        'shou': '售',
                        'hou': '后',
                        'you': '优',
                        'hui': '惠',
                    };
                    
                    // 5. 语义相似度（简化的字符串相似度）
                    function similarity(s1, s2) {
                        if (s1 === s2) return 1.0;
                        if (s1.length === 0 || s2.length === 0) return 0.0;
                        
                        const longer = s1.length > s2.length ? s1 : s2;
                        const shorter = s1.length > s2.length ? s2 : s1;
                        
                        // 编辑距离相似度
                        let distance = 0;
                        for (let i = 0; i < shorter.length; i++) {
                            if (longer.includes(shorter[i])) {
                                distance++;
                            }
                        }
                        
                        return distance / longer.length;
                    }
                    
                    // 检查每个字符的相似度
                    let totalSimilarity = 0;
                    for (const char of kw) {
                        let maxCharSimilarity = 0;
                        for (let i = 0; i < txt.length; i++) {
                            const charSimilarity = similarity(char, txt[i]);
                            if (charSimilarity > maxCharSimilarity) {
                                maxCharSimilarity = charSimilarity;
                            }
                        }
                        totalSimilarity += maxCharSimilarity;
                    }
                    
                    const avgSimilarity = totalSimilarity / kw.length;
                    if (avgSimilarity > 0.6) {
                        return avgSimilarity * 0.6;
                    }
                    
                    return 0.0;
                }
                
                // 对每个关键词进行匹配
                for (const [kw, indices] of Object.entries(keywordIndex)) {
                    const matchScore = fuzzyMatch(kw, text);
                    
                    if (matchScore >= 0.5) { // 匹配阈值
                        for (const idx of indices) {
                            if (!seen.has(idx)) {
                                seen.add(idx);
                                const rule = state.replyRules[idx];
                                
                                // 计算该规则的所有关键词匹配分数
                                const keywordScores = rule.keywords.map(k => ({
                                    keyword: k,
                                    score: fuzzyMatch(k, text)
                                })).filter(k => k.score >= 0.5);
                                
                                if (keywordScores.length > 0) {
                                    matched.push({
                                        rule: rule,
                                        matchedKeywords: keywordScores.map(k => k.keyword),
                                        matchScore: Math.max(...keywordScores.map(k => k.score)),
                                        confidence: keywordScores.length / rule.keywords.length
                                    });
                                }
                            }
                        }
                    }
                }
                
                // 按匹配分数排序
                matched.sort((a, b) => {
                    if (b.matchScore !== a.matchScore) {
                        return b.matchScore - a.matchScore;
                    }
                    return b.confidence - a.confidence;
                });
                
                return matched;
            }

                                        <div style="font-size: 12px; color: var(--text-muted);">回复规则</div>
                                        <div style="font-size: 18px; font-weight: 700; color: var(--success);">${state.replyRules.length}</div>
                                    </div>
                                    <div style="flex: 1; background: var(--bg-tertiary); padding: 16px; border-radius: var(--radius);">
                                        <div style="font-size: 12px; color: var(--text-muted);">AI生成</div>
                                        <div style="font-size: 18px; font-weight: 700; color: var(--warning);">${state.stats.aiGeneratedCount}</div>
                                    </div>
                                </div>
                            </div>
                            
                            <div>
                                <div style="font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px;">🔥 热门关键词</div>
                                <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                                    ${Object.entries(keywordIndex)
                                        .sort((a, b) => b[1].length - a[1].length)
                                        .slice(0, 10)
                                        .map(([kw, indices]) => `
                                            <div style="background: rgba(108, 92, 231, 0.1); color: var(--accent); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;">
                                                ${kw} <span style="opacity: 0.7;">(${indices.length})</span>
                                            </div>
                                        `).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="modal-actions">
                            <button class="btn btn-cancel" onclick="this.closest('.modal-overlay').remove()">关闭</button>
                        </div>
                    </div>
                `;
                
                modal.onclick = (e) => {
                    if (e.target === modal) modal.remove();
                };
                
                document.body.appendChild(modal);
            }

            // 在回复时更新统计数据
            function updateReplyStats(matched) {
                state.stats.totalDanmaku++;
                if (matched) {
                    state.stats.matchedDanmaku++;
                }
                state.stats.replyCount++;
                // 模拟回复时间（实际应用中应该使用真实时间）
                state.stats.totalReplyTime += Math.random() * 2 + 1; // 1-3秒
                updateStatsDisplay();
            }

            // 判断弹幕是否值得回复（过滤无意义内容）
            function isMeaningfulDanmaku(text) {
                const t = text.trim();
                if (t.length < 3) return false;
                // 纯表情/符号
                if (/^[\uD800-\uDFFF\u2600-\u27BF\uD83C-\uD83E\u2000-\u206F\s]+$/.test(t)) return false;
                // 纯数字（666、111、扣1等）
                if (/^[\d+\s]+$/.test(t)) return false;
                // 纯标点/语气词
                if (/^[。！？.!?，,；;～~、\s]+$/.test(t)) return false;
                // 纯问候（长度很短）
                const greetings = ['你好', '大家好', '下午好', '晚上好', '早上好', '哈喽', 'hello', '在吗', '111', '666', '牛', '棒'];
                if (greetings.includes(t.toLowerCase())) return false;
                return true;
            }

            function renderDanmaku() {
                $danmakuCount.textContent = state.danmaku.length;
                if (state.danmaku.length === 0) {
                    $danmakuList.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div>暂无弹幕</div></div>`;
                    return;
                }
                const meaningful = state.danmaku.filter(d => isMeaningfulDanmaku(d.text)).length;
                const colors = ['c1','c2','c3','c4'];
                $danmakuList.innerHTML = state.danmaku.map((d, i) => {
                    const canReply = isMeaningfulDanmaku(d.text);
                    const matched = canReply ? matchKeywords(d.text) : [];
                    const bestMatch = matched.length > 0 ? matched[0] : null;
                    return `
                    <div class="danmaku-item" data-index="${i}" style="${canReply ? '' : 'opacity:0.4;'}">
                        <div class="danmaku-avatar ${colors[i % 4]}">${escHtml(d.user[0])}</div>
                        <div class="danmaku-body">
                            <div class="danmaku-user">${escHtml(d.user)}</div>
                            <div class="danmaku-time">${escHtml(d.time || '')}</div>
                            <div class="danmaku-text">${escHtml(d.text)}${!canReply ? ' <span style="color:var(--text-muted);font-size:10px;">[跳过]</span>' : ''}</div>
                        </div>
                        <div class="danmaku-actions">
                            ${canReply ? `<button class="danmaku-reply-btn" onclick="app.openReply(${i})" title="手动回复">↩</button>` : ''}
                            ${d.replied ? '<span class="danmaku-replied-label">[已回复]</span>' : ''}
                            ${bestMatch ? `<span style="font-size:10px;color:var(--success);" title="匹配度:${Math.round(bestMatch.matchScore*100)}%">${Math.round(bestMatch.matchScore*100)}%</span>` : ''}
                        </div>
                    </div>
                `}).join('');
                $danmakuList.scrollTop = $danmakuList.scrollHeight;
            }

            function renderQueue() {
                if (state.playlist.length === 0) {
                    $queueList.innerHTML = `<div class="empty-state"><div class="empty-icon">📝</div><div>队列为空</div></div>`;
                    return;
                }
                let html = '';
                state.playlist.forEach((item, i) => {
                    let cls = '';
                    if (i < state.playingIdx) cls = 'played';
                    else if (i === state.playingIdx) cls = 'playing';
                    html += buildPlaylistItemHTML(item, i, i + 1, cls);
                });
                $queueList.innerHTML = html;
            }

            function buildPlaylistItemHTML(item, index, num, statusClass) {
                const isPlayed = statusClass === 'played';
                const isPlaying = statusClass === 'playing';
                let textHTML;
                if (isPlaying) {
                    textHTML = [...item.text].map((ch, ci) =>
                        `<span class="char${ci === state.currentCharIndex ? ' current' : ''}" data-ci="${ci}">${escHtml(ch)}</span>`
                    ).join('');
                } else {
                    const displayText = isPlayed && item.text.length > 36 ? item.text.slice(0, 36) + '…' : item.text;
                    textHTML = escHtml(displayText);
                }
                return `
                    <div class="queue-item ${statusClass}" data-pidx="${index}">
                        <div class="queue-num">${num}</div>
                        <div class="queue-text" title="${escAttr(item.text)}" ${!isPlayed ? `onclick="app.toggleQueueExpand(event, this)"` : ''}>${textHTML}</div>
                        <div class="queue-tag">${escHtml(item.file)}</div>
                        <div class="queue-actions">
                            <button class="btn" onclick="app.moveUp(${index})">↑</button>
                            <button class="btn" onclick="app.moveDown(${index})">↓</button>
                            <button class="btn btn-danger" onclick="app.removeItem(${index})">✕</button>
                            <button class="btn btn-warning" onclick="app.insertItem(${index})">⚡</button>
                            <button class="btn btn-edit" onclick="app.editItem(${index})">✎</button>
                        </div>
                    </div>`;
            }

            // ==================== REPLY MODAL ====================
            function openReply(index) {
                if (index < 0 || index >= state.danmaku.length) return;
                state.replyTargetIndex = index;
                state.replySelectedOption = -1;
                state.replyManualText = '';
                $btnReplySend.disabled = true;

                const d = state.danmaku[index];
                const matched = matchKeywords(d.text);

                if (matched.length > 0) {
                    // Matched: show options + manual fallback
                    $replyTitle.innerHTML = `💬 回复弹幕 — ${escHtml(d.user)}`;
                    let html = `
                        <div class="reply-danmaku-quote">
                            <div class="quote-user">${escHtml(d.user)} 说：</div>
                            ${escHtml(d.text)}
                        </div>
                        <div class="reply-match-info">
                            ✅ 匹配关键词
                            <span class="match-keywords">
                                ${matched.flatMap(m => m.matchedKeywords).filter((v, i, a) => a.indexOf(v) === i).slice(0, 6).map(k => `<span class="kw-tag">${escHtml(k)}</span>`).join('')}
                            </span>
                        </div>
                        <div class="reply-options-label">选择回复文案（点击选中，确认后加入待播队列）：</div>
                        <div class="reply-options-list">
                    `;

                    matched.forEach((m, mi) => {
                        m.rule.replies.forEach((reply, ri) => {
                            const optId = `opt_${mi}_${ri}`;
                            html += `
                                <div class="reply-option-card" data-opt="${optId}" data-reply="${escAttr(reply)}" data-tts="${escAttr(m.rule.ttsFile)}" onclick="app.selectReplyOption(this, '${optId}')">
                                    <div class="reply-option-text">${escHtml(reply)}</div>
                                    <div class="reply-option-meta">
                                        <span class="tts-tag">📁 ${escHtml(m.rule.ttsFile)}</span>
                                        <span class="reply-option-check">✓</span>
                                    </div>
                                </div>
                            `;
                        });
                    });

                    html += `
                        </div>
                        <div class="reply-manual-section">
                            <div class="section-label">✏️ 或手动输入自定义回复：</div>
                            <textarea id="replyManualInput" placeholder="输入自定义回复内容…" oninput="app.onReplyInput(this.value)">${escHtml(state.replyManualText)}</textarea>
                            <div class="reply-manual-actions">
                                <button class="btn-reply-polish" id="btnReplyPolish" onclick="app.polishReply()">✨ AI润色</button>
                                <span class="reply-char-count" id="replyCharCount">0 / 200</span>
                            </div>
                        </div>
                    `;
                    $replyBody.innerHTML = html;
                } else {
                    // No match: manual input only
                    $replyTitle.innerHTML = `✏️ 手动回复 — ${escHtml(d.user)}`;
                    let html = `
                        <div class="reply-danmaku-quote">
                            <div class="quote-user">${escHtml(d.user)} 说：</div>
                            ${escHtml(d.text)}
                        </div>
                        <div class="reply-no-match">
                            ⚠️ 未匹配到预设回复关键词，请手动输入回复内容
                        </div>
                        <div class="reply-manual-section" style="border-top:none;padding-top:0;">
                            <div class="section-label">回复内容：</div>
                            <textarea id="replyManualInput" placeholder="输入回复内容…" oninput="app.onReplyInput(this.value)">${escHtml(state.replyManualText)}</textarea>
                            <div class="reply-manual-actions">
                                <button class="btn-reply-polish" id="btnReplyPolish" onclick="app.polishReply()">✨ AI润色</button>
                                <span class="reply-char-count" id="replyCharCount">0 / 200</span>
                            </div>
                        </div>
                    `;
                    $replyBody.innerHTML = html;
                }

                // Auto-select if only 1 matched option
                if (matched.length > 0) {
                    const totalOptions = matched.reduce((sum, m) => sum + m.rule.replies.length, 0);
                    if (totalOptions === 1) {
                        const onlyOptId = `opt_0_0`;
                        const card = document.querySelector(`.reply-option-card[data-opt="${onlyOptId}"]`);
                        if (card) {
                            card.classList.add('selected');
                            state.replySelectedOption = onlyOptId;
                            $btnReplySend.disabled = false;
                        }
                    }
                }

                $replyModal.classList.add('active');
                $replyBody.scrollTop = 0;
                // Focus manual input without scrolling
                setTimeout(() => {
                    const inp = document.getElementById('replyManualInput');
                    if (inp) { inp.focus({ preventScroll: true }); }
                }, 100);
            }

            function selectReplyOption(el, optId) {
                // Deselect all
                document.querySelectorAll('.reply-option-card').forEach(c => c.classList.remove('selected'));
                // Select this
                el.classList.add('selected');
                state.replySelectedOption = optId;
                $btnReplySend.disabled = false;
            }

            function onReplyInput(text) {
                state.replyManualText = text;
                const count = document.getElementById('replyCharCount');
                if (count) count.textContent = `${text.length} / 200`;
                if (text.trim().length > 0) {
                    $btnReplySend.disabled = false;
                    // Clear option selection when typing
                    document.querySelectorAll('.reply-option-card').forEach(c => c.classList.remove('selected'));
                    state.replySelectedOption = -1;
                } else {
                    // When custom text is cleared, re-select the single option if it's the only one
                    const cards = document.querySelectorAll('.reply-option-card');
                    if (cards.length === 1 && state.replySelectedOption === -1) {
                        cards[0].classList.add('selected');
                        state.replySelectedOption = cards[0].dataset.opt;
                        $btnReplySend.disabled = false;
                    } else if (state.replySelectedOption === -1) {
                        $btnReplySend.disabled = true;
                    }
                }
            }

            function sendReply() {
                if (state.replyTargetIndex === null) return;
                let replyText, ttsFile;

                if (state.replySelectedOption !== -1) {
                    const card = document.querySelector(`.reply-option-card.selected`);
                    if (card) {
                        replyText = card.dataset.reply;
                        ttsFile = card.dataset.tts;
                    }
                }

                if (!replyText && state.replyManualText.trim()) {
                    replyText = state.replyManualText.trim();
                    ttsFile = '自定义回复.pcm';
                }

                if (!replyText) return;

                const item = { text: replyText, file: ttsFile };
                if (state.playingIdx >= 0) {
                    state.playlist.splice(state.playingIdx + 1, 0, item);
                    if (state.liveActive && !state.paused) {
                        startPlaying(state.playingIdx + 1);
                    }
                } else {
                    state.playlist.push(item);
                    if (state.liveActive && !state.paused) {
                        startPlaying(state.playlist.length - 1);
                    }
                }

                state.danmaku[state.replyTargetIndex].replied = true;

                // Log to reply audio history
                state.replyAudioLog.push({
                    id: genKBId(),
                    text: replyText,
                    file: ttsFile,
                    danmakuText: state.danmaku[state.replyTargetIndex].text,
                    time: new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
                });

                // Update stats
                const matched = matchKeywords(state.danmaku[state.replyTargetIndex].text);
                updateReplyStats(matched.length > 0);

                closeReplyModal();
                renderDanmaku();
            }

            function polishReply() {
                const inp = document.getElementById('replyManualInput');
                if (!inp || !inp.value.trim()) {
                    if (state.replySelectedOption !== -1) {
                        // Use selected option text as source
                        const card = document.querySelector('.reply-option-card.selected');
                        if (card) {
                            inp.value = card.dataset.reply;
                            state.replyManualText = inp.value;
                            onReplyInput(inp.value);
                        }
                    }
                    if (!inp.value.trim()) return;
                }
                const btn = document.getElementById('btnReplyPolish');
                if (!btn) return;
                const origHtml = btn.innerHTML;
                btn.innerHTML = '<span class="spinner"></span> 润色中…';
                btn.style.pointerEvents = 'none';

                setTimeout(() => {
                    const text = inp.value;
                    const polished = text
                        .replace(/哦/g, '哦～')
                        .replace(/哈/g, '哈～')
                        .replace(/！/g, '！')
                        + (text.endsWith('！') ? '' : ' 赶紧下单吧！');
                    inp.value = polished;
                    state.replyManualText = polished;
                    onReplyInput(polished);
                    btn.innerHTML = origHtml;
                    btn.style.pointerEvents = '';
                }, 1000 + Math.random() * 600);
            }

            function closeReplyModal() {
                $replyModal.classList.remove('active');
                state.replyTargetIndex = null;
                state.replySelectedOption = -1;
                state.replyManualText = '';
            }

            // ==================== PLAYING ====================
            function syncPlaying(idx) {
                state.playingIdx = idx;
                if (idx >= 0 && idx < state.playlist.length) {
                    state.currentPlaying = { index: idx, text: state.playlist[idx].text, file: state.playlist[idx].file };
                } else {
                    state.playingIdx = -1;
                    state.currentPlaying = null;
                }
            }

            function startPlaying(index) {
                if (state.charTimer) clearInterval(state.charTimer);
                if (index < 0 || index >= state.playlist.length) {
                    syncPlaying(-1);
                    renderQueue();
                    return;
                }
                ensureTTSFile(state.playlist[index]);
                syncPlaying(index);
                state.currentCharIndex = 0;
                renderQueue();
                startCharTimer();
            }

            function startCharTimer() {
                const totalChars = state.currentPlaying.text.length;
                const interval = Math.max(100, 8000 / totalChars);
                state.charTimer = setInterval(() => {
                    state.currentCharIndex++;
                    highlightCurrentChar();
                    if (state.currentCharIndex >= totalChars) {
                        clearInterval(state.charTimer);
                        state.charTimer = null;
                        setTimeout(onPlayFinished, 1200);
                    }
                }, interval);
            }

            function highlightCurrentChar() {
                const textEl = $queueList.querySelector('.queue-item.playing .queue-text');
                if (!textEl) return;
                const chars = textEl.querySelectorAll('.char');
                if (state.currentCharIndex > 0 && state.currentCharIndex - 1 < chars.length) {
                    chars[state.currentCharIndex - 1].classList.remove('current');
                }
                if (state.currentCharIndex < chars.length) {
                    chars[state.currentCharIndex].classList.add('current');
                }
            }

            function onPlayFinished() {
                if (state.playingIdx < 0) return;
                // 直播未开启或暂停状态，不自动播放下一条
                if (!state.liveActive || state.paused) {
                    syncPlaying(-1);
                    renderQueue();
                    return;
                }
                const nextIdx = state.playingIdx + 1;
                if (nextIdx < state.playlist.length) {
                    syncPlaying(nextIdx);
                    state.currentCharIndex = 0;
                    renderQueue();
                    startCharTimer();
                } else {
                    syncPlaying(-1);
                    renderQueue();
                }
            }

            // ==================== QUEUE ACTIONS ====================
            function addToQueue(text) {
                if (!text.trim()) return;
                const short = text.replace(/[^\u4e00-\u9fa5\w]/g, '').slice(0, 6);
                const file = short ? short + '.pcm' : '口播文案.pcm';
                const item = { text: text.trim(), file };
                state.playlist.push(item);
                renderQueue();
                if (state.liveActive && !state.paused && state.playingIdx < 0) {
                    startPlaying(state.playlist.length - 1);
                }
            }

            function removeItem(idx) {
                if (idx < 0 || idx >= state.playlist.length) return;
                if (!confirm('确定要移出这条播放项吗？')) return;

                const wasPlaying = idx === state.playingIdx;
                if (wasPlaying && state.charTimer) {
                    clearInterval(state.charTimer);
                    state.charTimer = null;
                }

                state.playlist.splice(idx, 1);
                if (idx < state.playingIdx) state.playingIdx--;

                if (state.playlist.length === 0) {
                    syncPlaying(-1);
                } else if (wasPlaying) {
                    if (state.playingIdx >= 0 && state.playingIdx < state.playlist.length) {
                        syncPlaying(state.playingIdx);
                        startCharTimer();
                    } else {
                        syncPlaying(-1);
                    }
                } else if (state.playingIdx >= 0 && state.playingIdx < state.playlist.length) {
                    syncPlaying(state.playingIdx);
                } else {
                    syncPlaying(-1);
                }

                renderQueue();
            }

            function insertItem(idx) {
                if (idx < 0 || idx >= state.playlist.length) return;
                if (idx === state.playingIdx) return;

                const item = state.playlist.splice(idx, 1)[0];
                if (idx < state.playingIdx) state.playingIdx--;

                if (state.playingIdx >= 0) {
                    state.playlist.splice(state.playingIdx + 1, 0, item);
                    if (state.liveActive && !state.paused) {
                        startPlaying(state.playingIdx + 1);
                    }
                } else {
                    state.playlist.push(item);
                    if (state.liveActive && !state.paused) {
                        startPlaying(state.playlist.length - 1);
                    }
                }
            }

            function toggleQueueExpand(event, el) {
                event.stopPropagation();
                el.classList.toggle('expanded');
            }

            function moveUp(idx) {
                if (idx <= 0 || idx >= state.playlist.length) return;
                [state.playlist[idx - 1], state.playlist[idx]] = [state.playlist[idx], state.playlist[idx - 1]];
                if (state.playingIdx === idx) state.playingIdx = idx - 1;
                else if (state.playingIdx === idx - 1) state.playingIdx = idx;
                renderQueue();
            }

            function moveDown(idx) {
                if (idx < 0 || idx >= state.playlist.length - 1) return;
                [state.playlist[idx], state.playlist[idx + 1]] = [state.playlist[idx + 1], state.playlist[idx]];
                if (state.playingIdx === idx) state.playingIdx = idx + 1;
                else if (state.playingIdx === idx + 1) state.playingIdx = idx;
                renderQueue();
            }

            function editItem(idx) {
                if (idx < 0 || idx >= state.playlist.length) return;
                state.editingIndex = idx;
                state.editingType = 'playlist';
                $editTextarea.value = state.playlist[idx].text;
                $editModal.classList.add('active');
                $editTextarea.focus();
            }

            function saveEdit() {
                if (state.editingIndex === null) return;
                const newText = $editTextarea.value.trim();
                if (!newText) return;
                state.playlist[state.editingIndex].text = newText;
                if (state.currentPlaying && state.playingIdx === state.editingIndex) {
                    state.currentPlaying.text = newText;
                }
                renderQueue();
                closeEditModal();
            }

            function closeEditModal() {
                $editModal.classList.remove('active');
                state.editingIndex = null;
            }

            // ==================== EVENT BINDINGS ====================
            $btnCancel.addEventListener('click', closeEditModal);
            $btnSave.addEventListener('click', saveEdit);
            $editModal.addEventListener('click', (e) => { if (e.target === $editModal) closeEditModal(); });
            $btnReplyCancel.addEventListener('click', closeReplyModal);
            $btnReplySend.addEventListener('click', sendReply);
            $replyModal.addEventListener('click', (e) => { if (e.target === $replyModal) closeReplyModal(); });

            const $btnKBClose = document.getElementById('btnKBClose');
            $btnKBClose.addEventListener('click', closeKB);
            $kbModal.addEventListener('click', (e) => { if (e.target === $kbModal) closeKB(); });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if ($kbModal.classList.contains('active')) closeKB();
                    else if ($replyModal.classList.contains('active')) closeReplyModal();
                    else if ($editModal.classList.contains('active')) closeEditModal();
                }
            });

            // ==================== HELPERS ====================
            function escHtml(s) {
                const d = document.createElement('div');
                d.textContent = s;
                return d.innerHTML;
            }
            function escAttr(s) {
                return s.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            // ==================== TEXT KNOWLEDGE MODALS ====================
            function showToast(msg) {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            }

            function openBcastTextModal() {
                const modal = document.getElementById('bcastTextModal');
                const ta = document.getElementById('bcastTextArea');
                if (ta) ta.value = state.bcastText;
                modal.classList.add('active');
                modal.onclick = function(e) {
                    if (e.target === modal) modal.classList.remove('active');
                };
            }

            function saveBcastText() {
                const text = document.getElementById('bcastTextArea').value;
                state.bcastText = text;
                localStorage.setItem('bcastText', text);
                document.getElementById('bcastTextModal').classList.remove('active');
                showToast('口播文案已保存');
            }

            function downloadBcastText() {
                const text = document.getElementById('bcastTextArea').value;
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'broadcast.txt';
                a.click();
                URL.revokeObjectURL(url);
            }

            function openAnswerTextModal() {
                const modal = document.getElementById('answerTextModal');
                const ta = document.getElementById('answerTextArea');
                if (ta) ta.value = state.answerText;
                modal.classList.add('active');

                if (!item) return;
                const playItem = { text: item.text, file: item.file || '' };
                ensureTTSFile(playItem);
                if (state.playingIdx >= 0) {
                    state.playlist.splice(state.playingIdx + 1, 0, playItem);
                    if (state.liveActive && !state.paused) {
                        startPlaying(state.playingIdx + 1);
                    }
                } else {
                    state.playlist.push(playItem);
                    if (state.liveActive && !state.paused) {
                        startPlaying(state.playlist.length - 1);

            function confirmAddRule() {
                const modal = document.getElementById('addRuleModal');
                const textEl = document.getElementById('addRuleTextarea');
                if (!textEl || !textEl.value.trim()) {
                    alert('请输入内容，格式：问题 : 答案');
                    return;
                }

                const text = textEl.value.trim();
                const match = text.match(/^(.+?)\s*[:：]\s*(.+)$/s);
                if (!match) {
                    alert('格式错误，请使用：问题 : 答案描述\n\n例如：运费险: 咱们家所有订单都有运费险，放心拍…');
                    return;
                }

                const category = match[1].trim();
                const description = match[2].trim();
                const keywords = expandQuestionKeywords(category);

                if (keywords.length === 0) {
                    alert('无法从该问题中提取有效关键词，请换一种描述');
                    return;
                }

                const newRule = {
                    id: genKBId(),
                    keywords: keywords,
                    category: category,
                    replies: [description],
                    ttsFile: category.replace(/[^\u4e00-\u9fa5\w]/g, '') + '.pcm'
                };
                state.replyRules.push(newRule);
                rebuildKeywordIndex();
                
                if (modal) modal.remove();
                renderReplyRulesKB();
            }

            function resetAudioBtn(btn) {

            function previewAudio(filename, btnId) {
                const btn = document.getElementById(btnId);
                if (!btn) return;

                // If clicking the already-playing button → pause
                if (kbAudioPlayingBtnId === btnId && kbAudioPlayer && !kbAudioPlayer.paused) {
                    kbAudioPlayer.pause();
                    resetAudioBtn(btn);
                    kbAudioPlayer = null;
                    kbAudioPlayingBtnId = null;
                    return;
                }

                // Stop any previous playback
                if (kbAudioPlayer) { kbAudioPlayer.pause(); kbAudioPlayer = null; }
                if (kbAudioPlayingBtnId) {
                    const prevBtn = document.getElementById(kbAudioPlayingBtnId);
                    if (prevBtn) resetAudioBtn(prevBtn);
                    kbAudioPlayingBtnId = null;
                }

                // Start new playback
                kbAudioPlayingBtnId = btnId;
                btn.classList.add('playing');
                btn.innerHTML = ICON_PAUSE;

                try {
                    kbAudioPlayer = new Audio();
                    kbAudioPlayer.src = 'data:audio/wav;base64,' + btoa('RIFF....'); // 实际生产环境替换为真实音频URL
                    kbAudioPlayer.play().catch(() => {});
                    kbAudioPlayer.onended = () => { resetAudioBtn(btn); kbAudioPlayer = null; kbAudioPlayingBtnId = null; };
                    kbAudioPlayer.onerror = () => {
                        // No actual audio file – simulate playback duration
                        setTimeout(() => {
                            resetAudioBtn(btn);
                            kbAudioPlayer = null;
                            kbAudioPlayingBtnId = null;
                        }, 2000);
                    };
                    // Fallback
                    setTimeout(() => {
                        if (kbAudioPlayer && kbAudioPlayer.paused && kbAudioPlayingBtnId === btnId) {
                            resetAudioBtn(btn);
                            kbAudioPlayer = null;
                            kbAudioPlayingBtnId = null;
                        }
                    }, 300);
                } catch (e) {
                    resetAudioBtn(btn);
                    kbAudioPlayingBtnId = null;
                }
            }

                    ],
                    '用户评价': [
                        '评价', '好评', '用户说', '买家说', '反馈', '评论', '体验',
                        '感受', '效果', '真实评价', '口碑', '推荐'
                    ],
                    '催单逼单': [
                        '抓紧', '赶紧', '快点', '不要错过', '库存', '不多', '限量',
                        '最后', '机会', '错过', '没了', '秒杀', '抢购', '拼手速'
                    ],
                    '感谢结束': [
                        '感谢', '谢谢', '再见', '明天见', '下次见', '拜拜', '下播',
                        '结束了', '感谢支持', '感谢观看', '感谢陪伴'
                    ]
                };
                
                // 更智能的分句算法 - 考虑中文标点完整性
                const sentences = [];
                let currentSentence = '';
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    currentSentence += char;
                    
                    // 句子结束标志
                    const isSentenceEnd = 
                        (char === '。' || char === '！' || char === '？' || 
                         char === '.' || char === '!' || char === '?' || 
                         char === ';' || char === '；') ||
                        (i > 0 && (char === '，' || char === ',') && currentSentence.length > 25);
                    
                    if (isSentenceEnd || i === text.length - 1) {
                        const trimmed = currentSentence.trim();
                        if (trimmed.length >= 6) {
                            sentences.push(trimmed);
                        }
                        currentSentence = '';
                    }
                }
                
                // 如果没有合适的分句，使用简单分句
                if (sentences.length === 0) {
                    sentences.push(...text.split(/[。！？.!?;；]/).filter(s => s.trim().length > 5));
                }
                
                // 直播话术转换库
                const rewordingMap = {
                    // 产品相关
                    '产品': ['这款宝贝', '这个产品', '这个好物', '这个神器', '这款好物'],
                    '商品': ['宝贝', '好物', '单品', '货品', '这款'],
