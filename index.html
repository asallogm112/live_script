                    '解决': ['处理', '搞定', '解决掉', '应对', '处理掉'],
                    '功能': ['功能', '用途', '作用', '用处', '功效'],
                    '特点': ['特色', '卖点', '亮点', '优势', '特点'],
                    
                    // 质量评价
                    '很好': ['很不错', '非常好', '特别棒', '相当不错', '非常出色'],
                    '不错': ['很好', '挺不错', '相当好', '还可以', '不错'],
                    '特别': ['非常', '格外', '尤其', '特别', '相当'],
                    '非常': ['特别', '非常', '极其', '十分', '相当'],
                    
                    // 价格相关
                    '价格': ['价位', '价格', '价钱', '售价', '定价'],
                    '优惠': ['折扣', '福利', '优惠', '特价', '活动价'],
                    '便宜': ['划算', '实惠', '性价比高', '价格美丽', '价格实惠'],
                    
                    // 直播专用语
                    '大家': ['小伙伴们', '宝宝们', '亲们', '老铁们', '朋友们'],
                    '我们': ['我们', '咱们', '咱家', '我们店铺', '我们直播间'],
                    '现在': ['现在', '此时此刻', '马上', '立刻', '现在马上'],
                    '下单': ['下单', '拍下', '购买', '带走', '入手'],
                };
                
                // 直播语气词库
                const livePhrases = [
                    '哦～', '哦～', '哦～',
                    '感兴趣的小伙伴可以关注一下哦～',
                    '现在下单还有额外惊喜！',
                    '抓紧时间，数量有限！',
                    '错过今天就没这个价格了！',
                    '想要的宝宝们赶紧下手！',
                    '这款真的超级好用！',
                    '我已经回购了好几次！',
                    '直播间专属福利！',
                    '今天下单还有赠品送！',
                    '包邮到家，售后无忧！',
                    '7天无理由退换货！',
                    '质量有问题我们承担来回运费！',
                    '相信我，买它不会错！',
                    '这款我已经用了一个月了！',
                    '真的是良心推荐！',
                    '不会让你们失望的！',
                    '买到就是赚到！'
                ];
                
                sentences.forEach((sentence, idx) => {
                    const trimmed = sentence.trim();
                    if (trimmed.length < 8) return;
                    
                    // 智能分类判断
                    let category = '产品介绍';
                    let maxScore = 0;
                    
                    for (const [cat, patterns] of Object.entries(categoryPatterns)) {
                        let score = 0;
                        for (const pattern of patterns) {
                            if (trimmed.includes(pattern)) {
                                score += 2;
                            }
                        }
                        if (score > maxScore) {
                            maxScore = score;
                            category = cat;
                        }
                    }
                    
                    // 高级洗稿处理
                    let processed = trimmed;
                    
                    // 1. 词汇替换
                    for (const [original, replacements] of Object.entries(rewordingMap)) {
                        if (processed.includes(original)) {
                            const replacement = replacements[Math.floor(Math.random() * replacements.length)];
                            processed = processed.replace(new RegExp(original, 'g'), replacement);
                        }
                    }
                    
                    // 2. 句式优化
                    processed = optimizeSentence(processed);
                    
                    // 3. 添加直播语气词
                    const shouldAddPhrase = Math.random() > 0.3;
                    if (shouldAddPhrase) {
                        const phrase = livePhrases[Math.floor(Math.random() * livePhrases.length)];
                        
                        // 根据句子结尾选择合适的连接方式
                        const lastChar = processed[processed.length - 1];
                        const isChinesePunct = lastChar === '。' || lastChar === '！' || lastChar === '？' || 
                                               lastChar === '，' || lastChar === '；';
                        
                        if (isChinesePunct) {
                            processed = processed.slice(0, -1) + '，' + phrase;
                        } else {
                            processed += '，' + phrase;
                        }
                    }
                    
                    // 4. 添加表情符号（随机）
                    if (Math.random() > 0.7) {
                        const emojis = ['❤️', '✨', '🔥', '💯', '👍', '🌟', '🎁', '💰'];
                        const emoji = emojis[Math.floor(Math.random() * emojis.length)];
                        processed += ' ' + emoji;
                    }
                    
                    // 5. 添加语气词后缀
                    const suffixChance = Math.random();
                    if (suffixChance > 0.8) {
                        processed += '～';
                    } else if (suffixChance > 0.6) {
                        processed += '！';
                    } else if (suffixChance > 0.4) {
                        processed += '哦';
                    }
                    
                    results.push({
                        text: processed,
                        category: category,
                        original: trimmed,
                        confidence: Math.min(0.95, maxScore / 10 + 0.6), // 置信度评分
                        lengthScore: Math.min(1, trimmed.length / 50) // 长度评分
                    });
                });
                
                // 按置信度排序并限制数量
                return results
                    .sort((a, b) => b.confidence - a.confidence)
                    .slice(0, Math.min(12, results.length));
                
                // 句子优化函数
                function optimizeSentence(sentence) {
                    let result = sentence;
                    
                    // 去除重复词
                    result = result.replace(/([^。！？.!?;；，,]+?)\1{2,}/g, '$1$1');
                    
                    // 优化过于冗长的句子
                    if (result.length > 40) {
                        // 尝试在适当位置添加停顿
                        const punctuationPositions = [',', '，', '、', ';', '；'];
                        let hasPunctuation = false;
                        for (const punct of punctuationPositions) {
                            if (result.includes(punct)) {
                                hasPunctuation = true;
                                break;
                            }
                        }
                        
                        if (!hasPunctuation && result.length > 50) {
                            // 在合适位置添加逗号
                            const midPoint = Math.floor(result.length / 2);
                            const lastSpace = result.lastIndexOf(' ', midPoint);
                            if (lastSpace > 0) {
                                result = result.slice(0, lastSpace) + '，' + result.slice(lastSpace + 1);
                            }
                        }
                    }
                    
                    // 确保句子以标点结尾
                    const lastChar = result[result.length - 1];
                    const isProperEnd = lastChar === '。' || lastChar === '！' || lastChar === '？' || 
                                      lastChar === '.' || lastChar === '!' || lastChar === '?';
                    if (!isProperEnd) {
                        result += '。';
                    }
                    
                    return result;
                }
            }

            function generateReplyRules() {
                const inputEl = document.getElementById('aiRuleInput');
                if (!inputEl || !inputEl.value.trim()) {
                    alert('请输入问答知识库');
                    return;
                }

                const text = inputEl.value.trim();
                const lines = text.split('\n').filter(line => line.trim());
                const rules = [];
                
                lines.forEach(line => {
                    const match = line.match(/^(.+?)\s*[:：]\s*(.+)$/);
                    if (match) {
                        const category = match[1].trim();
                        const description = match[2].trim();
                        const rule = generateRuleFromDescription(category, description);
                        if (rule) rules.push(rule);
                    }
                });
                
                if (rules.length > 0) {
                    state.aiGeneratedRules = rules;
                    const statusEl = document.getElementById('aiRuleStatus');
                    if (statusEl) {
                        statusEl.textContent = `✅ 成功生成了 ${rules.length} 条问答规则`;
                        statusEl.style.display = 'block';
                    }
                    renderAutoGenerateKB();
                } else {
                    alert('未能识别到有效的规则描述。请使用格式：问题 : 答案');
                }
            }

            function generateRuleFromDescription(category, description) {
                // 从问题短语(category)自动扩展匹配关键词
                const keywords = expandQuestionKeywords(category);
                if (keywords.length === 0) return null;

                // 回复就是答案描述本身
                return {
                    category: category,
                    keywords: keywords,
                    replies: [description],
                    ttsFile: category.replace(/[^\u4e00-\u9fa5\w]/g, '') + '.pcm'
                };
            }

            // 从问题短语自动扩展匹配关键词
            function expandQuestionKeywords(question) {
                const kw = new Set();
                kw.add(question);

                // 疑问词前缀/后缀
                const prefixes = ['', '问一下', '请问', '想问', '想问下', '咨询'];
                const suffixes = ['', '吗', '呢', '啊', '呀', '吧', '嘛'];

                prefixes.forEach(p => {
                    suffixes.forEach(s => {
                        kw.add(p + question + s);
                    });
                });

                // 拆词扩展：从问题短语中提取核心词，生成变体
                const coreWords = extractCoreWords(question);
                coreWords.forEach(word => {
                    kw.add(word);
                    // 疑问变体
                    kw.add(word + '吗');
                    kw.add(word + '呢');
                    kw.add('有' + word + '吗');
                    kw.add('有没有' + word);
                    kw.add('有没有' + word + '呢');
                    kw.add('有没有' + word + '啊');
                    kw.add('有没' + word);
                    kw.add('支持' + word + '吗');
                    kw.add('可以' + word + '吗');
                    kw.add('能' + word + '吗');
                    kw.add('怎么' + word);
                    kw.add('如何' + word);
                    kw.add('怎样' + word);
                    kw.add('什么' + word);
                    kw.add('什么时候' + word);
                    kw.add('几点' + word);
                    kw.add('多少' + word);
                    kw.add('多久' + word);
                    kw.add('哪里' + word);
                });

                return Array.from(kw).filter(k => k.length >= 2).slice(0, 30);
            }

            // 从问题短语提取核心词
            function extractCoreWords(question) {
                const words = new Set();
                // 2字词
                for (let i = 0; i <= question.length - 2; i++) {
                    words.add(question.substring(i, i + 2));
                }
                // 3字词
                for (let i = 0; i <= question.length - 3; i++) {
                    words.add(question.substring(i, i + 3));
                }
                return Array.from(words);
            }

                    keywords: rule.keywords,
                    category: rule.category,
                    replies: rule.replies,
                    ttsFile: rule.ttsFile
                };
                state.replyRules.push(newRule);
                rebuildKeywordIndex();
                
                alert(`已添加到列表（${rule.category}）`);
                if (kbActiveTab === 'rules') {
                    renderReplyRulesKB();
                }
            }

            function addToQueueFromAI(index) {
                if (index < 0 || index >= state.aiGeneratedBroadcasts.length) return;
                const item = state.aiGeneratedBroadcasts[index];
                
                const playItem = { text: item.text, file: '' };
                ensureTTSFile(playItem);
                if (state.playingIdx >= 0) {
                    state.playlist.splice(state.playingIdx + 1, 0, playItem);
                    if (state.liveActive && !state.paused) {
                        startPlaying(state.playingIdx + 1);
                    }
                } else {
                    state.playlist.push(playItem);
                    if (state.liveActive && !state.paused) {
                        startPlaying(state.playlist.length - 1);
                    }
                }
                
                // 记录到口播历史
                state.broadcastAudioLog.push({
                    id: genKBId(),
                    text: item.text,
                    file: playItem.file,
                    time: new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
                });
                
                alert('已加入播放队列');
            }

            // Expose API
            window.app = {
                removeItem,
                insertItem,
                moveUp,
                moveDown,
                editItem,
                toggleQueueExpand,
                addToQueue,
                openReply,
                selectReplyOption,
                onReplyInput,
                sendReply,
                polishReply,
                openBcastTextModal,
                saveBcastText,
                downloadBcastText,
                openAnswerTextModal,
                saveAnswerText,
                downloadAnswerText,
                openKB,
                closeKB,
                switchKBTab,
                addBroadcastKB,
                deleteBroadcastKB,
                editBroadcastKB,
                saveBroadcastKBEdit,
                cancelKBEdit,
                useFromKB,
                showAddRuleModal,
                confirmAddRule,
                deleteReplyRule,
                editReplyRule,
                saveReplyRuleEdit,
                deleteBroadcastAudio,
                deleteReplyAudio,
                previewAudio,
                // AI Generation functions
                generateBroadcastScripts,
                generateReplyRules,
                clearGeneratedBroadcasts,
                clearGeneratedRules,
                addGeneratedBroadcast,
                addGeneratedRule,
                addToQueueFromAI,
                // Automation functions
                toggleLive,
                pauseBroadcast,
                autoReplyToggle,
                showAnalytics,
                getState: () => state
            };

            // ==================== BOOT ====================
            initSampleData();
        })();
    </script>
</body>
</html>
